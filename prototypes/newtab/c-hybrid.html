<!doctype html>
<html lang="zh-hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C. Core columns + app chips</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { padding: 28px 32px; }

  .top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .search { flex: 0 1 420px; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); font: inherit; outline: none; }
  .search:focus { border-color: var(--accent); }

  /* Single-destination hubs (Teams, ChatGPT, X, local ports...) as a launcher row. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 12px; white-space: nowrap; }
  .chip:hover { border-color: var(--c); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .chip.down { color: var(--muted); }

  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .col { padding: 12px 0 8px; border-left: 1px solid var(--border); }
  .col:first-child { border-left: 0; }
  .col h2 { margin: 0 14px 8px; font-size: 12px; font-weight: 600; color: var(--c);
    display: flex; justify-content: space-between; }
  .col h2 span:last-child { color: var(--faint); font-weight: 400; }
  .col ul { margin: 0; padding: 0; list-style: none; }
  li a { display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 14px;
    color: var(--text); text-decoration: none; white-space: nowrap; }
  li a:hover { background: color-mix(in srgb, var(--c) 10%, transparent); }
  li a.down { color: var(--muted); }
  .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .k { font: 11px var(--mono); color: var(--faint); flex: none; }
  .up { color: var(--up); font-size: 10px; flex: none; width: 10px; }

  .results { margin: 0 0 18px; padding: 6px 0; list-style: none; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); }
  .results:empty { display: none; }
  @media (max-width: 900px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="top">
  <input class="search" placeholder="搜索  ( / )" autocomplete="off" />
  <nav class="chips"></nav>
</div>
<ul class="results"></ul>
<div class="cols"></div>

<script src="../../out/snapshot.js"></script>
<script src="../_shared/proto.js"></script>
<script>
  const P = window.Proto;
  const PER_HUB = 8;
  const CHIPS = 14;

  const row = (e, hub) => `<li><a href="${P.esc(e.href)}" target="_blank" class="${e.trend === "down" ? "down" : ""}"
      title="${P.esc(e.title ?? e.label ?? "")} · ${e.visits} visits · ${P.ago(e.last)}" style="--c:${P.color(hub)}">
      <span class="up">${P.rising(e) ? "▲" : ""}</span>
      <span class="t">${P.esc(P.text(e))}</span><span class="k">${P.esc(P.tag(e))}</span></a></li>`;

  document.querySelector(".cols").innerHTML = P.CORE.map((n) => P.byName.get(n)).filter(Boolean).map((h) => `
    <section class="col" style="--c:${P.color(h.name)}">
      <h2><span>${P.esc(h.name)}</span><span>${h.total}</span></h2>
      <ul>${h.entries.slice(0, PER_HUB).map((e) => row(e, h.name)).join("")}</ul>
    </section>`).join("");

  // Every non-core destination competes for a chip: entries from all other hubs, by score.
  const chips = P.all()
    .filter((e) => !P.CORE.includes(e.hub))
    .sort((a, b) => b.score - a.score)
    .slice(0, CHIPS);
  document.querySelector(".chips").innerHTML = chips.map((e) => `
    <a class="chip ${e.trend === "down" ? "down" : ""}" href="${P.esc(e.href)}" target="_blank"
       title="${P.esc(e.title ?? e.label ?? "")}" style="--c:${P.color(e.hub)}">
      <i></i>${P.esc((e.label && !e.label.startsWith(":") ? e.label : P.text(e)).slice(0, 18))}</a>`).join("");

  const results = document.querySelector(".results");
  P.bindSearch(document.querySelector(".search"), (hits) => {
    results.innerHTML = hits.map((e) => row(e, e.hub)).join("");
  });
</script>
</body>
</html>
