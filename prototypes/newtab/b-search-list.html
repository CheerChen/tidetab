<!doctype html>
<html lang="zh-hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B. Search + flat list</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { padding: 48px 32px; }
  main { width: min(760px, 100%); margin: 0 auto; }

  .search { width: 100%; padding: 14px 18px; margin-bottom: 20px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; font-size: 16px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .caption { margin: 0 4px 8px; color: var(--faint); font-size: 12px; }

  ol { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 24px; }
  li { break-inside: avoid; }
  li a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
    border-radius: 8px; color: var(--text); text-decoration: none; white-space: nowrap; }
  li a:hover { background: var(--surface); }
  li a.down { color: var(--muted); }
  .pill { flex: none; width: 74px; font-size: 11px; color: var(--c); overflow: hidden; text-overflow: ellipsis; }
  .pill::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--c); }
  .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .up { color: var(--up); font-size: 10px; flex: none; }
</style>
</head>
<body>
<main>
  <input class="search" placeholder="搜索全部入口  ( / )" autocomplete="off" />
  <p class="caption"></p>
  <ol></ol>
</main>

<script src="../../out/snapshot.js"></script>
<script src="../_shared/proto.js"></script>
<script>
  const P = window.Proto;
  const TOP = 24;

  const row = (e) => `<li><a href="${P.esc(e.href)}" target="_blank" class="${e.trend === "down" ? "down" : ""}"
      title="${P.esc(e.title ?? e.label ?? "")} · ${e.visits} visits · ${P.ago(e.last)}" style="--c:${P.color(e.hub)}">
      <span class="pill">${P.esc(e.hub)}</span>
      <span class="t">${P.esc(P.tag(e) ? `${P.tag(e)}  ${P.text(e)}` : P.text(e))}</span>
      <span class="up">${P.rising(e) ? "▲" : ""}</span></a></li>`;

  const list = document.querySelector("ol");
  const caption = document.querySelector(".caption");
  const best = P.all().sort((a, b) => b.score - a.score).slice(0, TOP);
  const showTop = () => {
    caption.textContent = `最常去的 ${TOP} 个入口`;
    list.innerHTML = best.map(row).join("");
  };
  showTop();

  // The list itself becomes the result list while typing.
  P.bindSearch(document.querySelector(".search"), (hits, q) => {
    if (!q) return showTop();
    caption.textContent = `${hits.length} 个匹配`;
    list.innerHTML = hits.map(row).join("");
  });
</script>
</body>
</html>
