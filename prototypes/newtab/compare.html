<!doctype html>
<html lang="zh-hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Tab · 版本对比</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #1a1a1a; }
  body { color: #e0e0e0; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .01em; }
  .stage { min-height: 100vh; padding: 0 24px 56px; }
  .stage-head { max-width: 1400px; margin: 0 auto; padding: 26px 0 14px; }
  .stage-head h1 { margin: 0 0 6px; font-size: 20px; font-weight: 820; color: #fff; }
  .stage-head p { margin: 0; color: #999; font-size: 12px; line-height: 1.7; }
  .host-layer { max-width: 1400px; margin: 0 auto; }
  .panels { max-width: 1400px; margin: 22px auto 0; }
  .panel-slot { margin-bottom: 34px; }
  .panel-tag { display: flex; align-items: center; gap: 10px; margin: 0 0 10px;
    font-size: 11px; font-weight: 760; letter-spacing: .08em;
    color: #888; text-transform: uppercase; }
  .panel-slot iframe { width: 100%; height: 600px; border: 1px solid #333;
    border-radius: 10px; background: #fff; }
  .compare-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 18px; }
  @media (max-width: 1080px) { .compare-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="stage">
  <header class="stage-head">
    <h1>New Tab · 版本对比</h1>
    <p>共 3 个版本。</p>
  </header>

  <!-- ==== Block versions ==== -->
  <div class="panels">
    <div class="compare-grid">
    <div class="panel-slot">
      <p class="panel-tag">1. a-columns.html — A: one column per hub, core hubs first, top 6 each, search on top</p>
      <iframe data-block src="a-columns.html" loading="lazy"></iframe>
    </div>
    <div class="panel-slot">
      <p class="panel-tag">2. b-search-list.html — B: big search box + flat global top 24, hub as colored pill</p>
      <iframe data-block src="b-search-list.html" loading="lazy"></iframe>
    </div>
    <div class="panel-slot">
      <p class="panel-tag">3. c-hybrid.html — C: 4 fixed core columns (top 8) + launcher chips for everything else</p>
      <iframe data-block src="c-hybrid.html" loading="lazy"></iframe>
    </div>
    </div>
  </div>
</div>
</body>
</html>
