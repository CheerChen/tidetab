<!doctype html>
<html lang="zh-hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A. Columns per hub</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { padding: 28px 32px; }

  .search { display: block; width: min(560px, 100%); margin: 0 auto 24px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .results { width: min(560px, 100%); margin: -16px auto 24px; padding: 0; list-style: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .results:empty { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .hub { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 0 6px; border-top: 3px solid var(--c); }
  .hub h2 { margin: 0 14px 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted);
    display: flex; justify-content: space-between; }
  .hub ul { margin: 0; padding: 0; list-style: none; }
  .more { display: block; padding: 4px 14px 2px; color: var(--faint); font-size: 12px; text-decoration: none; }

  li a { display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 14px;
    color: var(--text); text-decoration: none; white-space: nowrap; }
  li a:hover { background: color-mix(in srgb, var(--c, var(--accent)) 10%, transparent); }
  li a.down { color: var(--muted); }
  .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .k { font: 11px var(--mono); color: var(--faint); flex: none; }
  .up { color: var(--up); font-size: 10px; flex: none; width: 10px; }
</style>
</head>
<body>
<input class="search" placeholder="搜索全部入口  ( / )" autocomplete="off" />
<ul class="results"></ul>
<div class="grid"></div>

<script src="../../out/snapshot.js"></script>
<script src="../_shared/proto.js"></script>
<script>
  const P = window.Proto;
  const PER_HUB = 6;

  const row = (e, hub) => `<li><a href="${P.esc(e.href)}" target="_blank" class="${e.trend === "down" ? "down" : ""}"
      title="${P.esc(e.title ?? e.label ?? "")} · ${e.visits} visits · ${P.ago(e.last)}" style="--c:${P.color(hub)}">
      <span class="up">${P.rising(e) ? "▲" : ""}</span>
      <span class="t">${P.esc(P.text(e))}</span><span class="k">${P.esc(P.tag(e))}</span></a></li>`;

  // Core hubs first in fixed order, then every other hub above the score floor.
  const shown = [
    ...P.CORE.map((n) => P.byName.get(n)).filter(Boolean),
    ...P.hubs.filter((h) => !P.CORE.includes(h.name) && h.score >= 2),
  ];
  document.querySelector(".grid").innerHTML = shown.map((h) => `
    <section class="hub" style="--c:${P.color(h.name)}">
      <h2><span>${P.esc(h.name)}</span><span>${h.total}</span></h2>
      <ul>${h.entries.slice(0, PER_HUB).map((e) => row(e, h.name)).join("")}</ul>
      ${h.total > PER_HUB ? `<a class="more" href="#">…+${h.total - PER_HUB}</a>` : ""}
    </section>`).join("");

  const results = document.querySelector(".results");
  P.bindSearch(document.querySelector(".search"), (hits) => {
    results.innerHTML = hits.map((e) => row(e, e.hub)).join("");
  });
</script>
</body>
</html>
