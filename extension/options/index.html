<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tidetab 设置</title>
<link rel="stylesheet" href="../lib/tokens.css" />
<style>
  body { padding: 28px 32px; max-width: 640px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; margin: 12px 0 4px; color: var(--muted); }
  button { margin-top: 18px; padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  #status { margin-top: 12px; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<h1>导入历史</h1>
<p>选择之前导出的 <code>history_urls.json</code> 和 <code>history_visits.json</code>，作为排序的基础数据。可以重复导入，同一条访问不会重复计算。</p>
<label for="urls">history_urls.json</label>
<input id="urls" type="file" accept=".json,application/json" />
<label for="visits">history_visits.json</label>
<input id="visits" type="file" accept=".json,application/json" />
<br />
<button id="import">导入并重建快照</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
