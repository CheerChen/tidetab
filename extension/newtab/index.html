<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TideTab</title>
<link rel="icon" type="image/svg+xml" href="../icons/tab.svg" />
<link rel="stylesheet" href="../lib/tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { padding: 28px 32px; }
  header { position: relative; padding-top: 34px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 0 16px;
    font-size: clamp(23px, 6vw, 30px); letter-spacing: -0.025em; }
  .top { display: flex; margin-bottom: 18px; }
  .search { flex: 1; width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); font: inherit; outline: none; }
  .search:focus { border-color: var(--accent); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); }
  .col { padding: 12px 0 8px; border-left: 1px solid var(--border); }
  .col:first-child { border-left: 0; }
  .col h2 { margin: 0 14px 8px; font-size: 12px; font-weight: 600; color: var(--c); display: flex; justify-content: space-between; }
  .col h2 span:last-child { color: var(--faint); font-weight: 400; }
  .col ul, .results { margin: 0; padding: 0; list-style: none; }
  .results { margin: 0 0 18px; padding: 6px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .results:empty { display: none; }
  li a { display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 14px;
    color: var(--text); text-decoration: none; white-space: nowrap; }
  li a:hover { background: color-mix(in srgb, var(--c) 10%, transparent); }
  li a.down { color: var(--muted); }
  .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .k { font: 11px var(--mono); color: var(--faint); flex: none; }
  .up { color: var(--up); font-size: 10px; flex: none; width: 10px; }
  .empty { color: var(--muted); }
  .privacy { position: absolute; inset-block-start: 0; inset-inline-end: 0; }
  .privacy summary { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px;
    list-style: none; cursor: pointer; color: color-mix(in srgb, var(--muted) 80%, var(--text)); }
  .privacy summary::-webkit-details-marker { display: none; }
  .privacy summary:hover, .privacy[open] summary { background: var(--surface); color: var(--text); }
  .privacy summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .privacy p { position: absolute; z-index: 1; inset-inline-end: 0; inset-block-start: 100%;
    width: min(245px, calc(100vi - 64px)); margin: 5px 0 0; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  @media (max-width: 900px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header>
  <h1 class="brand"><img src="../icons/tab.svg" width="44" height="44" alt="" />TideTab</h1>
  <details class="privacy">
    <summary>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none" />
      </svg>
    </summary>
    <p></p>
  </details>
  <div class="top">
    <input class="search" autocomplete="off" />
  </div>
</header>
<ul class="results"></ul>
<div class="cols"></div>
<script src="privacy.js"></script>
<script type="module" src="newtab.js"></script>
</body>
</html>
